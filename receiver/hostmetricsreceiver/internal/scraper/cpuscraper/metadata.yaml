type: cpu

status:
  class: scraper
  stability:
    beta: [metrics]
  distributions: [core, contrib, k8s]
  codeowners:
    active: [dmitryax, braydonk]

reaggregation_enabled: true

sem_conv_version: 1.9.0

feature_gates:
  - id: receiver.hostmetrics.EmitV1SemanticConventions
    stage: alpha
    description: >-
      When enabled, V1 Semantic Conventions are emitted
    from_version: v0.145.0
    reference_url: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/45592

attributes:
  cpu:
    description: Logical CPU number starting at 0.
    type: string
    requirement_level: recommended

  state:
    description: Breakdown of CPU usage by type.
    type: string
    requirement_level: recommended
    enum: [idle, interrupt, nice, softirq, steal, system, user, wait]

metrics:
  system.cpu.frequency:
    enabled: false
    description: Current frequency of the CPU core in Hz.
    unit: "Hz"
    stability: development
    gauge:
      value_type: double
    attributes: [cpu]

  system.cpu.logical.count:
    enabled: false
    description: Number of available logical CPUs.
    unit: "{cpu}"
    stability: development
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative

  system.cpu.physical.count:
    enabled: false
    description: Number of available physical CPUs.
    unit: "{cpu}"
    stability: development
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative

  # Legacy metric - deprecated but still enabled by default for backward compatibility
  system.cpu.time:
    enabled: true
    description: Total seconds each logical CPU spent on each mode.
    unit: s
    stability: development
    sum:
      value_type: double
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [cpu, state]
    warnings:
      if_enabled_not_set: This metric will be disabled by default in a future release. Use system.cpu.time/v1 instead.

  # New semconv metric - disabled by default, users opt-in
  system.cpu.time/v1:
    name: system.cpu.time   # Same emitted metric name
    enabled: true
    description: CPU time in milliseconds (new semantic conventions)
    stability:
      level: beta
    unit: ms
    sum:
      value_type: double
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [cpu, state]

  system.cpu.utilization:
    enabled: false
    description: Difference in system.cpu.time since the last measurement per logical CPU, divided by the elapsed time (value in interval [0,1]).
    unit: "1"
    stability: development
    gauge:
      value_type: double
    attributes: [cpu, state]
